name: Build ReSukiSU (+SUSFS) kernel for RMX3366 ColorOS 12.1 / 4.19.157

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

env:
  KERNEL_REPO: https://github.com/ermyltsor/android_kernel_realme_sm8250.git
  KERNEL_BRANCH: rui3.0
  DEFCONFIG: vendor/kona-perf_defconfig
  DEFCONFIG_FILE: arch/arm64/configs/vendor/kona-perf_defconfig
  RESUKISU_SETUP: https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh
  CLANG_URL: https://github.com/ZyCromerZ/Clang/releases/download/10.0.1-20220724-release/Clang-10.0.1-20220724.tar.gz

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Route A: SUSFS + Kona/ColorOS fix patch, selinux static-export check bypassed
          #          by enabling KALLSYMS_ALL (ReSukiSU Kbuild skips the check then).
          - name: resukisu-susfs-cos15
            fixpatch: patches/kona_cos15_a15__susfs_fixed.patch
            kallsyms_all: "y"
            staticfix: "false"
          # Route B: same, but for the OxygenOS-flavoured Kona fix patch
          - name: resukisu-susfs-oos
            fixpatch: patches/kona_oos__susfs_fixed.patch
            kallsyms_all: "y"
            staticfix: "false"
          # Route C: classic "no-kprobe" route - KALLSYMS_ALL off, selinux statics
          #          exported by hand so static_export_check.mk passes.
          - name: resukisu-susfs-cos15-nostatic
            fixpatch: patches/kona_cos15_a15__susfs_fixed.patch
            kallsyms_all: "n"
            staticfix: "true"
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    name: ${{ matrix.name }}

    steps:
      # ---------------------------------------------------------------- setup --
      # NOTE: without an explicit checkout, $GITHUB_WORKSPACE is EMPTY and the
      # patches/ directory does not exist. Do not remove this step.
      - name: Checkout repository (provides patches/)
        uses: actions/checkout@v4
        with:
          path: ci

      - name: Prepare diagnostics directory
        run: |
          mkdir -p /tmp/diag/rej
          test -f "${{ github.workspace }}/ci/patches/susfs_patch_to_4.19.patch" \
            || { echo "FATAL: checkout did not provide ci/patches/"; exit 1; }
          ls -la "${{ github.workspace }}/ci/patches"

      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
                      /usr/local/graalvm /opt/google /usr/lib/jvm || true
          sudo apt-get clean
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential bc bison flex libssl-dev libelf-dev \
            zip unzip python3 cpio rsync wget git lz4 libncurses-dev file patch \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Download toolchain (Clang 10.0.1-20220724)
        run: |
          wget -q -c "$CLANG_URL" -O clang.tar.gz
          mkdir -p "$HOME/clang-tools"
          tar -xzf clang.tar.gz -C "$HOME/clang-tools"
          "$HOME/clang-tools/bin/clang" --version
          aarch64-linux-gnu-gcc --version | head -1

      # --------------------------------------------------------- kernel source --
      - name: Clone kernel source (${{ env.KERNEL_BRANCH }})
        run: |
          git clone --depth=1 -b "$KERNEL_BRANCH" "$KERNEL_REPO" kernel
          cd kernel
          echo "== HEAD ==";            git log --oneline -1
          echo "== version ==";         head -6 Makefile
          echo "== defconfig ==";       ls -la "${{ env.DEFCONFIG_FILE }}"
          echo "== stock kallsyms ==";  grep -nE '^CONFIG_KALLSYMS' "${{ env.DEFCONFIG_FILE }}" || echo "(none in defconfig)"
          echo "== oplus guard cfg ==" ; grep -cE '^CONFIG_OPLUS_SECURE_GUARD|^CONFIG_OPLUS_MOUNT_BLOCK|^CONFIG_OPLUS_KEVENT_UPLOAD' "${{ env.DEFCONFIG_FILE }}" || true

      - name: Integrate ReSukiSU
        run: |
          cd kernel
          curl -LSs "$RESUKISU_SETUP" -o /tmp/setup_resukisu.sh
          bash /tmp/setup_resukisu.sh main
          echo "== KernelSU dir =="
          ls KernelSU/kernel | head -20
          echo "== symlink =="
          ls -la drivers/kernelsu
          echo "== hook choices in Kconfig =="
          grep -nE "config KSU$|KSU_TRACEPOINT_HOOK|KSU_MANUAL_HOOK$|KSU_SUSFS$|depends on THREAD_INFO_IN_TASK" drivers/kernelsu/Kconfig
          echo "== Kbuild hook wiring =="
          grep -nE "KALLSYMS_ALL|static_export_check|MANUAL_HOOK|CONFIG_KSU_SUSFS|Unsupported hook method|fs/susfs.c" drivers/kernelsu/Kbuild || true

      # --------------------------------------------------------- SUSFS patches --
      - name: Apply SUSFS patch stack
        run: |
          set -x
          PATCHES="${{ github.workspace }}/ci/patches"
          cd kernel

          cp "$PATCHES/susfs_patch_to_4.19.patch" ./

          # ---- stage 1: generic SUSFS v2.3.0 patch for 4.19 (some .rej expected) --
          set +e
          patch -p1 --no-backup-if-mismatch < susfs_patch_to_4.19.patch \
            > /tmp/diag/patch_main.log 2>&1
          RC=$?
          set -e
          echo "stage1 rc=$RC (non-zero tolerated, fix patch comes next)"
          tail -60 /tmp/diag/patch_main.log
          echo "=== rej after stage 1 ==="
          find . -name '*.rej' | tee /tmp/diag/rej_stage1.txt

          # ---- stage 2: device-specific fix patch --------------------------------
          if [ -n "${{ matrix.fixpatch }}" ]; then
            cp "${{ github.workspace }}/ci/${{ matrix.fixpatch }}" ./
            FIX="$(basename "${{ matrix.fixpatch }}")"
            set +e
            patch -p1 --no-backup-if-mismatch < "$FIX" > /tmp/diag/patch_fix.log 2>&1
            RC=$?
            set -e
            echo "stage2 rc=$RC"
            tail -60 /tmp/diag/patch_fix.log
          fi
          echo "=== rej after stage 2 ==="
          find . -name '*.rej' | tee /tmp/diag/rej_stage2.txt

          # keep the rejected hunks around for offline analysis
          find . -name '*.rej' -exec cp --parents {} /tmp/diag/rej/ \; || true

          # ---- stage 3: SUSFS inline hook call sites ----------------------------
          cp "$PATCHES/susfs_inline_hook_patches.sh" ./
          set +e
          bash susfs_inline_hook_patches.sh ./
          echo "inline hook script rc=$?"
          set -e
          echo "=== ksu_handle_* hooks injected ==="
          for f in fs/exec.c fs/open.c fs/read_write.c fs/stat.c fs/namei.c \
                   drivers/input/input.c security/security.c security/selinux/hooks.c \
                   security/selinux/ss/services.c kernel/reboot.c kernel/sys.c; do
            printf "  %-32s %s\n" "$f" "$(grep -o 'ksu_handle' "$f" 2>/dev/null | wc -l)"
          done
          echo "=== inline_hook_check requirements ==="
          for pair in "fs/exec.c:ksu_handle_execveat" "fs/open.c:ksu_handle_faccessat" \
                      "fs/read_write.c:ksu_handle_sys_read" "fs/stat.c:ksu_handle_stat" \
                      "kernel/reboot.c:ksu_handle_sys_reboot" "kernel/sys.c:ksu_handle_setresuid" \
                      "drivers/input/input.c:ksu_handle_input_handle_event"; do
            f="${pair%%:*}"; s="${pair##*:}"
            if grep -q "$s" "$f" 2>/dev/null; then echo "OK   $s @ $f"; else echo "MISS $s @ $f"; fi
          done
          echo "=== incompatible legacy hooks (must be absent) ==="
          for pair in "fs/read_write.c:ksu_vfs_read_hook" "fs/read_write.c:ksu_init_rc_hook" \
                      "fs/exec.c:ksu_execveat_hook" "drivers/input/input.c:ksu_input_hook"; do
            f="${pair%%:*}"; s="${pair##*:}"
            if grep -wq "$s" "$f" 2>/dev/null; then echo "BAD  $s @ $f"; else echo "OK   $s absent in $f"; fi
          done

          # drop .rej/.orig so they cannot disturb the build
          find . -type f \( -name '*.rej' -o -name '*.orig' \) -delete

          # ---- hard checks: SUSFS core must exist --------------------------------
          fail=0
          for f in fs/susfs.c include/linux/susfs.h include/linux/susfs_def.h; do
            if [ -f "$f" ]; then echo "OK   $f"; else echo "MISS $f"; fail=1; fi
          done
          grep -q 'susfs.o' fs/Makefile && echo "OK   fs/Makefile susfs.o" || { echo "MISS fs/Makefile susfs.o"; fail=1; }
          grep -q 'CONFIG_KSU_SUSFS' fs/namespace.c && echo "OK   fs/namespace.c" || echo "WARN fs/namespace.c not patched"
          grep -q 'susfs_is_inode_sus_path' fs/namei.c && echo "OK   fs/namei.c" || echo "WARN fs/namei.c not patched"
          grep -q 'susfs' kernel/sys.c && echo "OK   kernel/sys.c" || echo "WARN kernel/sys.c not patched"
          if [ -f include/linux/susfs.h ]; then
            grep -m1 'SUSFS_VERSION' include/linux/susfs.h || true
          fi
          [ "$fail" = "0" ] || { echo "FATAL: SUSFS core files missing"; exit 1; }
          echo "SUSFS apply stage OK"

      # ------------------------------------------------- no-kprobe static state --
      # static_export_check.mk (included by ReSukiSU/Kbuild unless KALLSYMS_ALL=y)
      # hard-errors when security/selinux/selinuxfs.c still declares these static.
      - name: Export selinux statics (no-kprobe route)
        if: matrix.staticfix == 'true'
        run: |
          set -x
          cd kernel
          F=security/selinux/selinuxfs.c
          if [ -f "$F" ]; then
            if grep -q 'static ssize_t (\*const write_op\[\])' "$F"; then
              sed -i 's/static ssize_t (\*const write_op\[\])(struct file \*, char \*, size_t)/ssize_t (*const write_op[])(struct file *, char *, size_t)/' "$F"
            else
              sed -i 's/static ssize_t (\*write_op\[\])(struct file \*, char \*, size_t)/ssize_t (*write_op[])(struct file *, char *, size_t)/' "$F"
            fi
            sed -i 's/^static const struct file_operations sel_handle_status_ops = {/const struct file_operations sel_handle_status_ops = {/' "$F"
            sed -i 's/^static DEFINE_MUTEX(sel_mutex)/DEFINE_MUTEX(sel_mutex)/' "$F"
            echo "== selinuxfs.c now =="
            grep -nE 'write_op\[\]|sel_handle_status_ops|sel_mutex' "$F" | head
          else
            echo "no $F"
          fi
          for f in security/selinux/ss/status.c security/selinux/ss/services.c security/selinux/hooks.c; do
            [ -f "$f" ] || continue
            sed -i 's/^static struct page \*selinux_status_page/struct page *selinux_status_page/' "$f"
            sed -i 's/^static DEFINE_MUTEX(selinux_status_lock)/DEFINE_MUTEX(selinux_status_lock)/' "$f"
            sed -i 's/^static DEFINE_RWLOCK(policy_rwlock)/DEFINE_RWLOCK(policy_rwlock)/' "$f"
            sed -i 's/^static struct security_operations selinux_ops/struct security_operations selinux_ops/' "$f"
            echo "== $f checked =="
          done
          echo "static export step done"

      # ------------------------------------------------------------- defconfig --
      - name: Configure defconfig
        run: |
          cd kernel
          D="${{ env.DEFCONFIG_FILE }}"
          sed -i '/^CONFIG_KSU/d; /^# CONFIG_KSU/d' "$D"
          sed -i '/^CONFIG_KALLSYMS/d; /^# CONFIG_KALLSYMS/d' "$D"
          {
            echo ''
            echo '# ---- ReSukiSU + SUSFS (added by CI) ----'
            echo 'CONFIG_KSU=y'
            echo 'CONFIG_KSU_MULTI_MANAGER_SUPPORT=y'
            echo 'CONFIG_KALLSYMS=y'
            if [ "${{ matrix.kallsyms_all }}" = "y" ]; then
              echo 'CONFIG_KALLSYMS_ALL=y'
            else
              echo '# CONFIG_KALLSYMS_ALL is not set'
            fi
            echo 'CONFIG_KSU_SUSFS=y'
            echo 'CONFIG_KSU_SUSFS_SUS_PATH=y'
            echo 'CONFIG_KSU_SUSFS_SUS_MOUNT=y'
            echo 'CONFIG_KSU_SUSFS_SUS_KSTAT=y'
            echo 'CONFIG_KSU_SUSFS_SPOOF_UNAME=y'
            echo 'CONFIG_KSU_SUSFS_ENABLE_LOG=y'
            echo 'CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y'
            echo 'CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y'
            echo 'CONFIG_KSU_SUSFS_OPEN_REDIRECT=y'
            echo 'CONFIG_KSU_SUSFS_SUS_MAP=y'
          } >> "$D"

          # CONFIG_KSU_SUSFS depends on THREAD_INFO_IN_TASK
          if grep -q 'THREAD_INFO_IN_TASK' drivers/kernelsu/Kconfig; then
            echo 'CONFIG_THREAD_INFO_IN_TASK=y' >> "$D"
          fi
          echo "== defconfig tail =="
          tail -20 "$D"

      - name: Run defconfig + resolve
        run: |
          cd kernel
          export PATH="$HOME/clang-tools/bin:$PATH"
          export CROSS_COMPILE=aarch64-linux-gnu-
          export LLVM=1
          make O=out ARCH=arm64 CC=clang AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy \
               OBJDUMP=llvm-objdump STRIP=llvm-strip LLVM=1 "${{ env.DEFCONFIG }}" \
               > /tmp/diag/defconfig.log 2>&1 || { tail -60 /tmp/diag/defconfig.log; exit 1; }
          make O=out ARCH=arm64 CC=clang AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy \
               OBJDUMP=llvm-objdump STRIP=llvm-strip LLVM=1 olddefconfig \
               >> /tmp/diag/defconfig.log 2>&1 || { tail -60 /tmp/diag/defconfig.log; exit 1; }
          echo "=== resolved KSU / SUSFS config ==="
          grep -E '^CONFIG_(KSU|THREAD_INFO_IN_TASK)|^CONFIG_KALLSYMS|^CONFIG_KPROBES' out/.config | sort
          echo "=== localversion ==="
          grep -E '^CONFIG_LOCALVERSION' out/.config || true
          grep -q '^CONFIG_KSU=y' out/.config            || { echo "FATAL: CONFIG_KSU not enabled"; exit 1; }
          grep -q '^CONFIG_KSU_SUSFS=y' out/.config      || { echo "FATAL: CONFIG_KSU_SUSFS not enabled (check THREAD_INFO_IN_TASK/64BIT)"; exit 1; }
          grep -q '^CONFIG_THREAD_INFO_IN_TASK=y' out/.config || { echo "FATAL: THREAD_INFO_IN_TASK not enabled"; exit 1; }
          if [ "${{ matrix.kallsyms_all }}" = "y" ]; then
            grep -q '^CONFIG_KALLSYMS_ALL=y' out/.config || { echo "FATAL: KALLSYMS_ALL not enabled"; exit 1; }
          fi
          grep -q '^CONFIG_KSU_TRACEPOINT_HOOK=y' out/.config && { echo "FATAL: tracepoint hook selected instead of SUSFS"; exit 1; }
          grep -q '^CONFIG_KSU_MANUAL_HOOK=y' out/.config && { echo "FATAL: manual hook also selected (conflicts with SUSFS)"; exit 1; }
          echo "config OK"

      - name: Build kernel
        run: |
          cd kernel
          export PATH="$HOME/clang-tools/bin:$PATH"
          CROSS_COMPILE=aarch64-linux-gnu-; export CROSS_COMPILE
          export KBUILD_BUILD_USER=android
          export KBUILD_BUILD_HOST=android-build
          export LLVM=1
          set +e
          make O=out ARCH=arm64 CC=clang AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy \
               OBJDUMP=llvm-objdump STRIP=llvm-strip LLVM=1 -j"$(nproc)" \
               2>&1 | tee build.log
          RC=${PIPESTATUS[0]}
          echo "=== build exit code: $RC ==="
          df -h /
          if [ "$RC" -ne 0 ]; then
            echo "=== last 150 lines ==="
            tail -150 build.log
            echo "=== error lines ==="
            grep -nE "error:|Error [0-9]|No rule to make|undefined reference|You should integrate|Unsupported hook" build.log | tail -80
            exit "$RC"
          fi

      # ------------------------------------------------------------- verify ----
      - name: Verify output
        if: success()
        run: |
          cd kernel
          ls -lh out/arch/arm64/boot/Image 2>&1 || true
          file out/arch/arm64/boot/Image
          echo "=== KERNEL VERSION STRING ==="
          strings out/arch/arm64/boot/Image | grep -m1 "Linux version" | tee /tmp/diag/version.txt
          if strings out/arch/arm64/boot/Image | grep -m1 -q "Linux version 4.19.157-perf+"; then
            echo "OK: 4.19.157-perf+ preserved (vendor .ko vermagic will match)"
          else
            echo "FATAL: version string differs - vendor modules would refuse to load"
            exit 1
          fi
          echo "=== ReSukiSU / SUSFS markers in Image ==="
          for m in "ReSukiSU" "KernelSU" "ksu_" "/data/adb/ksud" "susfs" "SUSFS_VERSION"; do
            printf "  %-16s %s\n" "$m" "$(strings out/arch/arm64/boot/Image | grep -c "$m")"
          done
          echo "=== .ko count ==="
          find out -name '*.ko' | wc -l
          sha256sum out/arch/arm64/boot/Image | tee Image.sha256

      - name: Pack artifacts
        if: success()
        run: |
          cd kernel
          mkdir -p /tmp/artifacts
          cp out/arch/arm64/boot/Image /tmp/artifacts/Image
          cp out/arch/arm64/boot/dtb /tmp/artifacts/dtb 2>/dev/null || true
          cp out/arch/arm64/boot/dtbo.img /tmp/artifacts/dtbo.img 2>/dev/null || true
          cp out/System.map /tmp/artifacts/System.map 2>/dev/null || true
          cp out/.config /tmp/artifacts/dotconfig.txt
          cp Image.sha256 /tmp/artifacts/ 2>/dev/null || true
          tar -czf /tmp/artifacts/modules.tar.gz $(find out -name '*.ko') 2>/dev/null || true
          ls -lh /tmp/artifacts

      - name: Upload kernel artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-image
          path: /tmp/artifacts/*
          if-no-files-found: error
          retention-days: 14

      - name: Upload diagnostics (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-diag
          path: |
            kernel/build.log
            /tmp/diag/**
          if-no-files-found: ignore
          retention-days: 14
